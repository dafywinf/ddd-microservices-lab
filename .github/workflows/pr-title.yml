name: PR title

# PRs are squash-merged with the PR title as the commit message, and semantic-release versions each service from
# those messages. So the title must be a Conventional Commit: fix: -> patch release, feat: -> minor, feat!: -> major,
# chore:/docs:/ci:/test:/refactor: -> no release
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
